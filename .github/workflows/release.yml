name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # A tag can be pushed from any commit, including one CI never saw, so
      # these run here as well as in ci.yml. esbuild only transpiles, so
      # without them a `bun run build` that succeeds still publishes a main.js
      # that does not typecheck and whose tests fail.
      - run: bun run typecheck

      - run: bun run lint:ratchet

      - run: bun run test

      - name: Verify manifest and versions.json match the tag
        run: bun run scripts/verify-release.mjs "${GITHUB_REF#refs/tags/}"

      - run: bun run build

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            main.js manifest.json styles.css
